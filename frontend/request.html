<!DOCTYPE html>
<html>
<head><title>NID Application</title><link rel="stylesheet" href="style.css"></head>
<body>
  <h2>Apply for NID Correction / Lost Card</h2>
  <form id="reissueForm">
    <input type="text" placeholder="Enter NID Number" required><br><br>
    <select>
      <option value="Correction">Data Correction</option>
      <option value="Lost Card">Lost Card Reissue</option>
    </select><br><br>
    <textarea placeholder="Reason for application"></textarea><br><br>
    <button type="submit">Submit Request</button>
  </form>
</body>
</html>
